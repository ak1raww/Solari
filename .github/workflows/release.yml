# Based partially on Alyxia's work, thanks so much!

name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*
      - 'v*.*.*'

env:
  FORCE_COLOR: true

permissions:
  contents: write

jobs:
  prepare-release:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create release tag
        id: release-tag
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            latest=$(git tag --list 'v1.0.*' --sort=-version:refname | head -n 1)
            if [ -z "$latest" ]; then
              tag="v1.0.0"
            else
              patch=${latest##*.}
              tag="v1.0.$((patch + 1))"
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          else
            tag="$GITHUB_REF_NAME"
          fi

            echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: prepare-release
    runs-on: ubuntu-latest # Go without CGO seems to not depend on glibc, so building on latest should be fine

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libsdl2-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libglx-dev libgl1-mesa-dev libxxf86vm-dev libglfw3-dev libwayland-dev libwayland-egl1 libegl-dev libxkbcommon-dev wayland-protocols extra-cmake-modules

      - name: Install Go dependencies
        run: go get -v

      - name: Recreate vendor and apply Wayland patches
        run: |
          go mod vendor
          git apply -p1 --ignore-space-change patches/wayland.patch

      - name: Build GUI (X11)
        run:
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags static -ldflags "-s
          -w -X 'solari/buildinfo.InstallerGitHash=$(git rev-parse --short
          HEAD)' -X 'solari/buildinfo.InstallerTag=${{ needs.prepare-release.outputs.tag }}'" -o
          Solari-x11

      - name: Build GUI (Wayland)
        run:
            CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags "static wayland" -ldflags "-s -w -X 'solari/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'solari/buildinfo.InstallerTag=${{ needs.prepare-release.outputs.tag }}'" -o Solari-wayland

      - name: Build GUI (Combined)
        run:
            CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags "static combined" -ldflags "-s -w -X 'solari/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'solari/buildinfo.InstallerTag=${{ needs.prepare-release.outputs.tag }}'" -o Solari

      - name: Build CLI
        run:
            CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags "cli" -ldflags "-s -w -X 'solari/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'solari/buildinfo.InstallerTag=${{ needs.prepare-release.outputs.tag }}'" -o SolariCli-linux

      - name: Update executable
        run: |
          chmod +x Solari*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Solari-linux
          path: |
            Solari-x11
            Solari-wayland
            Solari
            SolariCli-linux

  build-linux-arm64:
    needs: prepare-release
    runs-on: ubuntu-24.04-arm # Native ARM64 runner, the GUI needs ARM64 X11/Wayland/GL libraries

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-arm64-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-arm64-go-

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libsdl2-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libglx-dev libgl1-mesa-dev libxxf86vm-dev libglfw3-dev libwayland-dev libwayland-egl1 libegl-dev libxkbcommon-dev wayland-protocols extra-cmake-modules

      - name: Install Go dependencies
        run: go get -v

      - name: Recreate vendor and apply Wayland patches
        run: |
          go mod vendor
          git apply -p1 --ignore-space-change patches/wayland.patch

      - name: Build GUI (X11)
        run: CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -v -tags static -ldflags "-s -w -X 'solari/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'solari/buildinfo.InstallerTag=${{ needs.prepare-release.outputs.tag }}'" -o Solari-x11-arm64

      - name: Build GUI (Wayland)
        run: CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -v -tags "static wayland" -ldflags "-s -w -X 'solari/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'solari/buildinfo.InstallerTag=${{ needs.prepare-release.outputs.tag }}'" -o Solari-wayland-arm64

      - name: Build GUI (Combined)
        run: CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -v -tags "static combined" -ldflags "-s -w -X 'solari/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'solari/buildinfo.InstallerTag=${{ needs.prepare-release.outputs.tag }}'" -o Solari-arm64

      - name: Build CLI
        run: CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -v -tags "cli" -ldflags "-s -w -X 'solari/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'solari/buildinfo.InstallerTag=${{ needs.prepare-release.outputs.tag }}'" -o SolariCli-linux-arm64

      - name: Update executable
        run: |
          chmod +x Solari*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Solari-linux-arm64
          path: |
            Solari-x11-arm64
            Solari-wayland-arm64
            Solari-arm64
            SolariCli-linux-arm64

  build-windows:
    needs: prepare-release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          path-type: inherit

      - name: Install Windows dependencies
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm git mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2

      - name: Install Go dependencies
        shell: msys2 {0}
        run: |
          go get -v
          go install github.com/tc-hib/go-winres@d743268d7ea168077ddd443c4240562d4f5e8c3e  # v0.3.3

      - name: Build GUI
        shell: msys2 {0}
        run: |
          go-winres make --product-version "git-tag"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -v -tags "static gui" -ldflags "-s -w -H=windowsgui -extldflags=-static -X 'solari/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'solari/buildinfo.InstallerTag=${{ needs.prepare-release.outputs.tag }}'" -o Solari.exe

      - name: Build CLI
        shell: msys2 {0}
        run: |
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -v -tags "cli" -ldflags "-s -w -X 'solari/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'solari/buildinfo.InstallerTag=${{ needs.prepare-release.outputs.tag }}'" -o SolariCli.exe
          cp SolariCli.exe SolariCli-x64.exe # Explicit arch in the name, winget picks installers by it

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Solari-windows
          path: |
            Solari.exe
            SolariCli.exe
            SolariCli-x64.exe

  build-windows-arm64:
    needs: prepare-release
    runs-on: windows-latest # No ARM64 runner needed, the ARM64 binaries are cross-compiled

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key: ${{ runner.os }}-arm64-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-arm64-go-

      # The GUI needs a C/C++ compiler targeting ARM64 Windows, llvm-mingw provides one
      - name: Install llvm-mingw
        shell: pwsh
        run: |
          $version = "20260908"
          $sha256 = "1bcf74d06b724aeecaa6412ca85f5b26fb1da770e7cdcefa9263c9c5c3ad34b6"
          $zip = "$env:RUNNER_TEMP\llvm-mingw.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/llvm-mingw-$version-ucrt-x86_64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $sha256) { throw "llvm-mingw checksum mismatch" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\llvm-mingw-$version-ucrt-x86_64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Go dependencies
        shell: bash
        run: |
          go get -v
          go install github.com/tc-hib/go-winres@d743268d7ea168077ddd443c4240562d4f5e8c3e  # v0.3.3

      - name: Build GUI
        shell: bash
        run: |
          "$(go env GOPATH)/bin/go-winres" make --arch arm64 --product-version "git-tag"
          CGO_ENABLED=1 GOOS=windows GOARCH=arm64 CC=aarch64-w64-mingw32-clang CXX=aarch64-w64-mingw32-clang++ go build -v -tags "static gui" -ldflags "-s -w -H=windowsgui -extldflags=-static -X 'solari/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'solari/buildinfo.InstallerTag=${{ needs.prepare-release.outputs.tag }}'" -o Solari-arm64.exe

      - name: Build CLI
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -v -tags "cli" -ldflags "-s -w -X 'solari/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'solari/buildinfo.InstallerTag=${{ needs.prepare-release.outputs.tag }}'" -o SolariCli-arm64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Solari-windows-arm64
          path: |
            Solari-arm64.exe
            SolariCli-arm64.exe

  release:
    runs-on: ubuntu-latest
    needs: [prepare-release, build-linux, build-linux-arm64, build-windows, build-windows-arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Download Linux Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Solari-linux
          path: linux

      - name: "Download Linux ARM64 Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Solari-linux-arm64
          path: linux

      - name: "Download Windows Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Solari-windows
          path: windows

      - name: "Download Windows ARM64 Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Solari-windows-arm64
          path: windows

      - name: Delete existing release
        run: gh release delete "${{ needs.prepare-release.outputs.tag }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: ${{ needs.prepare-release.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          make_latest: ${{ !contains(needs.prepare-release.outputs.tag, '-') }}
          prerelease: ${{ contains(needs.prepare-release.outputs.tag, '-') }}
          draft: false
          body: |
            This is release ${{ needs.prepare-release.outputs.tag }} of Solari.
          files: |
            linux/Solari-x11
            linux/Solari-wayland
            linux/Solari
            linux/SolariCli-linux
            linux/Solari-x11-arm64
            linux/Solari-wayland-arm64
            linux/Solari-arm64
            linux/SolariCli-linux-arm64
            windows/Solari*.exe